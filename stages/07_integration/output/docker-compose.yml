# Prod-like profile: PostgreSQL + backend. Android emulator continues to point at host loopback.
# Run from the repo root:  docker compose -f stages/07_integration/output/docker-compose.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnmno
      POSTGRES_PASSWORD: vulnmno
      POSTGRES_DB: vulnmno
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnmno"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../../        # repo root
      dockerfile: stages/07_integration/output/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      VULNMNO_ENV: prod-like
      VULNMNO_DATABASE_URL: postgresql+asyncpg://vulnmno:vulnmno@db:5432/vulnmno
      VULNMNO_SEED_ON_STARTUP: "true"
      VULNMNO_JWT_SECRET: change-me-in-actual-prod-this-is-a-training-product
    ports:
      - "8000:8000"
