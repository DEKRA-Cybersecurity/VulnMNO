# Phase 2 prod-like profile: PostgreSQL + backend (with Stripe/FCM optional) + provisioning mock.
# Run from the repo root:
#   docker compose -f stages/13_phase2_integration/output/docker-compose.yml up --build
#
# The backend container reuses the same Dockerfile as Phase 1
# (stages/07_integration/output/Dockerfile). Phase 2 adds env vars for gateway driver
# switches; defaults stay on `dev` so the smoke is identical to Phase 1 unless overridden.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnmno
      POSTGRES_PASSWORD: vulnmno
      POSTGRES_DB: vulnmno
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnmno"]
      interval: 5s
      timeout: 3s
      retries: 10

  provisioning-mock:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir 'fastapi>=0.110' 'uvicorn[standard]>=0.27' &&
             python -c \"
from fastapi import FastAPI
import secrets
app = FastAPI()
@app.post('/activate')
def activate(payload: dict):
    return {'provisioningId': 'prov_' + secrets.token_hex(6), 'status': 'active'}
@app.post('/deactivate')
def deactivate(payload: dict):
    return {'status': 'deactivated'}
\" > /app/server.py && uvicorn server:app --host 0.0.0.0 --port 9000"
    ports:
      - "9000:9000"

  backend:
    build:
      context: ../../../        # repo root
      dockerfile: stages/07_integration/output/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      provisioning-mock:
        condition: service_started
    environment:
      VULNMNO_ENV: prod-like
      VULNMNO_DATABASE_URL: postgresql+asyncpg://vulnmno:vulnmno@db:5432/vulnmno
      VULNMNO_SEED_ON_STARTUP: "true"
      VULNMNO_SEED_PHASE2_ON_STARTUP: "true"
      VULNMNO_JWT_SECRET: change-me-in-actual-prod-this-is-a-training-product
      VULNMNO_ADMIN_SESSION_SECRET: change-me-too-this-is-a-training-product
      # Gateway drivers — flip to "stripe" / "fcm" with appropriate creds to test the real path.
      VULNMNO_PAYMENT_DRIVER: dev
      # VULNMNO_STRIPE_SECRET_KEY: sk_test_...
      VULNMNO_PROVISIONING_DRIVER: http
      VULNMNO_PROVISIONING_URL: http://provisioning-mock:9000
      VULNMNO_PUSH_DRIVER: dev
      # VULNMNO_FCM_CREDENTIALS_PATH: /run/secrets/fcm-service-account.json
      VULNMNO_RATE_LIMIT_ENABLED: "true"
      VULNMNO_DEFAULT_LOCALE: en
    ports:
      - "8000:8000"
