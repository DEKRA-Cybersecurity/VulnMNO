components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CursorParam:
      in: query
      name: cursor
      required: false
      schema:
        type: string
    FromParam:
      in: query
      name: from
      required: false
      schema:
        type: string
        format: date-time
    ToParam:
      in: query
      name: to
      required: false
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    InvoiceId:
      in: path
      name: invoiceId
      required: true
      schema:
        type: string
        pattern: ^INV-[0-9]+$
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: string
    PurchaseId:
      in: path
      name: purchaseId
      required: true
      schema:
        type: string
        pattern: ^PUR-[0-9]+$
    TicketId:
      in: path
      name: ticketId
      required: true
      schema:
        type: string
        pattern: ^TCK-[0-9]+$
  responses:
    Unauthorized:
      description: Missing/invalid/expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: Wrong credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OtpInvalid:
      description: OTP code wrong, expired, or attempts exhausted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RefreshFailed:
      description: Refresh token expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Action conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyConflict:
      description: Same Idempotency-Key used with a different body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PromoError:
      description: Promo invalid or ineligible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlanIneligible:
      description: Target plan ineligible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlanChangePending:
      description: A pending plan change blocks a new one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PurchaseConflict:
      description: Insufficient balance or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketClosed:
      description: Ticket is closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
              - TOKEN_EXPIRED
              - TOKEN_REVOKED
              - INVALID_CREDENTIALS
              - OTP_INVALID
              - NOT_FOUND
              - VALIDATION_FAILED
              - RATE_LIMITED
              - CONFLICT
              - INTERNAL
              - PROMO_INVALID
              - PROMO_INELIGIBLE
              - INSUFFICIENT_BALANCE
              - PLAN_INELIGIBLE
              - PLAN_CHANGE_PENDING
              - TICKET_CLOSED
              - IDEMPOTENCY_CONFLICT
              - ADMIN_FORBIDDEN
              - ADMIN_SESSION_EXPIRED
              - PAYMENT_DECLINED
              - PROVISIONING_FAILED
              - PUSH_FAILED
              - LOYALTY_INSUFFICIENT_POINTS
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          format: decimal
          multipleOf: 0.01
        currency:
          type: string
          enum:
          - EUR
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - tokenType
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token TTL in seconds. Currently 3600.
        tokenType:
          type: string
          enum:
          - Bearer
    OtpChallenge:
      type: object
      required:
      - challenge
      - challengeToken
      - expiresIn
      properties:
        challenge:
          type: string
          enum:
          - OTP
        challengeToken:
          type: string
        expiresIn:
          type: integer
          description: Challenge TTL in seconds. Currently 300.
    LoginRequest:
      type: object
      required:
      - msisdn
      - password
      properties:
        msisdn:
          type: string
          pattern: ^\+[0-9]{8,15}$
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginResponse:
      oneOf:
      - $ref: '#/components/schemas/TokenPair'
      - $ref: '#/components/schemas/OtpChallenge'
      discriminator:
        propertyName: __kind
        mapping: {}
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    OtpVerifyRequest:
      type: object
      required:
      - challengeToken
      - code
      properties:
        challengeToken:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
    PasswordResetRequest:
      type: object
      required:
