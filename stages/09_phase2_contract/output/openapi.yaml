openapi: 3.1.0
info:
  title: VulnMNO API
  version: 0.2.0-phase2
  description: "HTTP API for the VulnMNO mobile self-care platform.\nSingle source of truth for backend (stages 03\u201304)\
    \ and Android client (stages 05\u201306).\nSee `02_api_contract/output/endpoints.md` for the human-readable index,\n`02_api_contract/output/auth-model.md`\
    \ for the auth flow, and\n`02_api_contract/output/error-codes.md` for the master error enum.\n\nPhase 2 adds /admin/*\
    \ HTML endpoints, loyalty endpoints, and gateway-related error codes."
servers:
- url: http://localhost:8000
  description: Local development (uvicorn on host)
- url: http://10.0.2.2:8000
  description: "Android emulator \u2192 host loopback"
tags:
- name: auth
- name: customers
- name: accounts
- name: shop
- name: plans
- name: usage
- name: support
- name: notifications
- name: admin
- name: loyalty
security:
- bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags:
      - auth
      operationId: ep001_login
      security: []
      summary: EP-001 Authenticate with phone + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Either a TokenPair (non-OTP customers) or an OtpChallenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
  /api/auth/logout:
    post:
      tags:
      - auth
      operationId: ep002_logout
      summary: EP-002 Revoke the refresh token bound to this access token
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/refresh:
    post:
      tags:
      - auth
      operationId: ep003_refresh
      security: []
      summary: EP-003 Exchange a refresh token for a new TokenPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New TokenPair. The presented refresh token is now revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/RefreshFailed'
  /api/auth/otp/verify:
    post:
      tags:
      - auth
      operationId: ep004_otp_verify
      security: []
      summary: EP-004 Complete an OTP challenge and receive a TokenPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: TokenPair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/OtpInvalid'
  /api/auth/password-reset/request:
    post:
      tags:
      - auth
      operationId: ep005_password_reset_request
      security: []
      summary: EP-005 Request a password reset by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Always returned, even for unknown MSISDNs.
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /api/auth/password-reset/confirm:
    post:
      tags:
      - auth
      operationId: ep006_password_reset_confirm
      security: []
      summary: EP-006 Confirm a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Password updated. All refresh tokens revoked.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/OtpInvalid'
  /api/customers/me:
    get:
      tags:
      - customers
      operationId: ep010_get_me
      summary: EP-010 Retrieve own profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/customers/me/contact-details:
    put:
      tags:
      - customers
      operationId: ep011_update_contact_details
      summary: EP-011 Update contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactDetailsUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/customers/me/lines:
    get:
      tags:
      - customers
      operationId: ep012_list_lines
      summary: EP-012 List own mobile lines
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated mobile lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMobileLines'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/customers/me/sim-profile:
    get:
      tags:
      - customers
      operationId: ep013_get_sim_profile
      summary: EP-013 Get own SIM/eSIM profile
      responses:
        '200':
          description: SIM profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimProfileRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/accounts/me/balance:
    get:
      tags:
      - accounts
      operationId: ep020_get_balance
      summary: EP-020 Get current balance
      responses:
        '200':
          description: Current balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/accounts/me/transactions:
    get:
      tags:
      - accounts
      operationId: ep021_list_transactions
      summary: EP-021 List transactions
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTransactions'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/accounts/me/topup:
    post:
      tags:
      - accounts
      operationId: ep022_topup
      summary: EP-022 Top up the prepaid wallet
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupRequest'
      responses:
        '201':
          description: Top-up transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /api/accounts/me/invoices:
    get:
      tags:
      - accounts
      operationId: ep023_list_invoices
      summary: EP-023 List invoices
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated invoice summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedInvoiceSummaries'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/accounts/me/invoices/{invoiceId}:
    get:
      tags:
      - accounts
      operationId: ep024_get_invoice
      summary: EP-024 Get invoice detail
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice with line items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/me/invoices/{invoiceId}/download:
    get:
      tags:
      - accounts
      operationId: ep025_download_invoice
      summary: EP-025 Download invoice as PDF
      parameters:
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: PDF body.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/me/refunds:
    post:
      tags:
      - accounts
      operationId: ep026_request_refund
      summary: EP-026 Request a refund (creates a tracking ticket)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '202':
          description: Refund request accepted; a ticket has been opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shop/products:
    get:
      tags:
      - shop
      operationId: ep030_list_products
      summary: EP-030 List products
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      - in: query
        name: category
        required: false
        schema:
          type: string
      - in: query
        name: featured
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Paginated products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/shop/products/{productId}:
    get:
      tags:
      - shop
      operationId: ep031_get_product
      summary: EP-031 Get product detail
      parameters:
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shop/promotions/apply:
    post:
      tags:
      - shop
      operationId: ep032_apply_promo
      summary: EP-032 Compute the final price after applying a promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPromoRequest'
      responses:
        '200':
          description: Promotion application result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoApplicationRead'
        '400':
          $ref: '#/components/responses/PromoError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/shop/purchases:
    post:
      tags:
      - shop
      operationId: ep033_create_purchase
      summary: EP-033 Create a purchase
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseRequest'
      responses:
        '201':
          description: Purchase confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRead'
        '400':
          $ref: '#/components/responses/PromoError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PurchaseConflict'
    get:
      tags:
      - shop
      operationId: ep034_list_purchases
      summary: EP-034 List purchases
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - confirmed
          - cancelled
          - failed
      responses:
        '200':
          description: Paginated purchases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPurchases'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/shop/purchases/{purchaseId}:
    get:
      tags:
      - shop
      operationId: ep035_get_purchase
      summary: EP-035 Get purchase detail
      parameters:
      - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Purchase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/shop/purchases/{purchaseId}/cancel:
    post:
      tags:
      - shop
      operationId: ep036_cancel_purchase
      summary: EP-036 Cancel a purchase
      parameters:
      - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Purchase cancelled; refund transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/plans/current:
    get:
      tags:
      - plans
      operationId: ep040_get_current_plan
      summary: EP-040 Get current plan
      responses:
        '200':
          description: Current plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/plans/available:
    get:
      tags:
      - plans
      operationId: ep041_list_available_plans
      summary: EP-041 List plans available to this customer
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPlans'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/plans/change:
    post:
      tags:
      - plans
      operationId: ep042_change_plan
      summary: EP-042 Change plan (immediate or scheduled)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanChangeRequest'
      responses:
        '200':
          description: Plan changed immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeRead'
        '202':
          description: Plan change scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeRead'
        '400':
          $ref: '#/components/responses/PlanIneligible'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/PlanChangePending'
  /api/plans/change/{changeId}/cancel:
    post:
      tags:
      - plans
      operationId: ep043_cancel_plan_change
      summary: EP-043 Cancel a pending plan change
      parameters:
      - in: path
        name: changeId
        required: true
        schema:
          type: string
          pattern: ^PCH-[0-9]+$
      responses:
        '200':
          description: Plan change cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/plans/services/add:
    post:
      tags:
      - plans
      operationId: ep044_add_service
      summary: EP-044 Add an optional service to the current plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceToggleRequest'
      responses:
        '200':
          description: Updated plan view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/plans/services/remove:
    post:
      tags:
      - plans
      operationId: ep045_remove_service
      summary: EP-045 Remove an optional service from the current plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceToggleRequest'
      responses:
        '200':
          description: Updated plan view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/usage/calls:
    get:
      tags:
      - usage
      operationId: ep050_usage_calls
      summary: EP-050 List call usage records
      parameters:
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated usage records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/sms:
    get:
      tags:
      - usage
      operationId: ep051_usage_sms
      summary: EP-051 List SMS usage records
      parameters:
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated usage records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/data:
    get:
      tags:
      - usage
      operationId: ep052_usage_data
      summary: EP-052 List data usage sessions
      parameters:
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated usage records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/roaming:
    get:
      tags:
      - usage
      operationId: ep053_usage_roaming
      summary: EP-053 List roaming usage records
      parameters:
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Paginated usage records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/usage/export:
    get:
      tags:
      - usage
      operationId: ep054_usage_export
      summary: EP-054 Export usage summary
      parameters:
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - in: query
        name: format
        required: true
        schema:
          type: string
          enum:
          - csv
          - json
      responses:
        '200':
          description: Export body in the requested format.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageRecordRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/support/tickets:
    post:
      tags:
      - support
      operationId: ep060_create_ticket
      summary: EP-060 Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
      - support
      operationId: ep061_list_tickets
      summary: EP-061 List own tickets
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/CursorParam'
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - open
          - pending
          - closed
      responses:
        '200':
          description: Paginated tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTicketSummaries'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/support/tickets/{ticketId}:
    get:
      tags:
      - support
      operationId: ep062_get_ticket
      summary: EP-062 Get ticket detail (includes messages)
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/support/tickets/{ticketId}/messages:
    post:
      tags:
      - support
      operationId: ep063_add_ticket_message
      summary: EP-063 Add a message to a ticket
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessageRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TicketClosed'
  /api/support/tickets/{ticketId}/attachments:
    post:
      tags:
      - support
      operationId: ep064_add_ticket_attachment
      summary: "EP-064 Upload an attachment to a ticket (\u2264 10 MB)"
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAttachmentRead'
        '400':
          $ref: '#/components/responses/ValidationFailed'
