{% extends "admin/base.html" %}
{% block title %}Customers · VulnMNO admin{% endblock %}
{% block topbar_title %}Customers{% endblock %}
{% block content %}

<div class="card mb-3">
  <div class="card-body">
    <form method="get" action="/admin/customers"
          hx-get="/admin/customers" hx-target="#results" hx-push-url="true">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0">
          <i class="bi bi-search text-muted"></i>
        </span>
        <input class="form-control border-start-0" name="q" value="{{ q }}"
               placeholder="Search by msisdn, name, email or CUST-… ID">
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
    </form>
  </div>
</div>

<div id="results">
  {% include "admin/_partials/customers_table.html" %}
</div>
{% endblock %}
