<div class="card h-100" id="balance-card">
  <div class="card-body">
    <h6 class="card-subtitle">Wallet balance</h6>
    {% if balance %}
      <p class="fs-3 fw-bold mb-1" style="letter-spacing: -0.02em;">{{ balance.amount|money(balance.currency) }}</p>
      <p class="text-muted small mb-2">
        <i class="bi bi-clock-history me-1"></i>{{ balance.last_updated|dt }}
      </p>
    {% else %}
      <p class="text-muted mb-2"><i class="bi bi-dash-circle me-1"></i>No account</p>
    {% endif %}
    {% if flash %}
      <div class="alert alert-success py-2 small mb-2">
        <i class="bi bi-check-circle me-1"></i>{{ flash }}
      </div>
    {% endif %}
    {% if can_adjust_balance and balance %}
    <form method="post"
          action="/admin/customers/{{ customer.public_id }}/balance-adjust"
          hx-post="/admin/customers/{{ customer.public_id }}/balance-adjust"
          hx-target="#balance-card"
          hx-swap="outerHTML"
          hx-confirm="Adjust this customer's balance?">
      {{ csrf_input(csrf_token) }}
      <div class="row g-2">
        <div class="col-4">
          <input class="form-control form-control-sm" name="amount" placeholder="±€" required>
        </div>
        <div class="col-8">
          <input class="form-control form-control-sm" name="reason" placeholder="Reason (≥ 10 chars)" required minlength="10">
        </div>
      </div>
      <button class="btn btn-sm btn-warning mt-2 w-100" type="submit">
        <i class="bi bi-pencil-square me-1"></i>Adjust balance
      </button>
    </form>
    {% endif %}
  </div>
</div>
