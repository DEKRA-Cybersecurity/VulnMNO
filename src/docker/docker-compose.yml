# VulnMNO — prod-like compose stack (Postgres + backend + provisioning mock).
#
# Run from the src/ directory:
#   cd src && docker compose -f docker/docker-compose.yml up --build
#
# Backend listens on http://localhost:8000
#   - API:           /api/*
#   - Admin portal:  /admin/        (seed login: ops / admin1234)
#   - OpenAPI:       /openapi.json  /docs
#
# Flip *_DRIVER vars to "stripe" / "http" / "fcm" with real creds to exercise
# the real-gateway paths. Defaults stay on "dev" so the stack works offline.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnmno
      POSTGRES_PASSWORD: vulnmno
      POSTGRES_DB: vulnmno
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnmno"]
      interval: 5s
      timeout: 3s
      retries: 10

  provisioning-mock:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./provisioning_mock.py:/app/provisioning_mock.py:ro
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir 'fastapi>=0.110' 'uvicorn[standard]>=0.27' &&
        uvicorn provisioning_mock:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  backend:
    build:
      context: ..                     # src/ directory
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      provisioning-mock:
        condition: service_started
    environment:
      VULNMNO_ENV: prod-like
      VULNMNO_DATABASE_URL: postgresql+asyncpg://vulnmno:vulnmno@db:5432/vulnmno
      VULNMNO_SEED_ON_STARTUP: "true"
      VULNMNO_SEED_PHASE2_ON_STARTUP: "true"
      VULNMNO_JWT_SECRET: change-me-in-actual-prod-this-is-a-training-product
      VULNMNO_ADMIN_SESSION_SECRET: change-me-too-this-is-a-training-product
      # Gateway drivers — flip to "stripe" / "fcm" with appropriate creds to test the real path.
      VULNMNO_PAYMENT_DRIVER: dev
      # VULNMNO_STRIPE_SECRET_KEY: sk_test_...
      VULNMNO_PROVISIONING_DRIVER: http
      VULNMNO_PROVISIONING_URL: http://provisioning-mock:9000
      VULNMNO_PUSH_DRIVER: dev
      # VULNMNO_FCM_CREDENTIALS_PATH: /run/secrets/fcm-service-account.json
      VULNMNO_RATE_LIMIT_ENABLED: "true"
      VULNMNO_DEFAULT_LOCALE: en
    ports:
      - "8000:8000"
